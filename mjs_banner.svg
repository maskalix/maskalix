<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 176" width="640" height="176" role="img" aria-label="Martin J. Skalicky — Digital Architect">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101a12"/>
      <stop offset="0.5" stop-color="#56775f"/>
      <stop offset="1" stop-color="#94af9b"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="636" height="172" rx="16"/>
    </clipPath>
  </defs>

  <!-- card background -->
  <rect x="2" y="2" width="636" height="172" rx="16" fill="#101a12" stroke="#56775f" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- brand accent bar at the bottom -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="170" width="640" height="6" fill="url(#accent)"/>
  </g>

  <!-- logo (left). Renders when opened directly; blank on GitHub/Gitea unless base64-embedded -->
  <image x="28" y="38" width="100" height="100" preserveAspectRatio="xMidYMid meet"
         href="https://typestor.lnln.eu//brand/mjs/image/mjs_d_t.png"
         xlink:href="https://typestor.lnln.eu//brand/mjs/image/mjs_d_t.png"/>

  <!-- name -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#f2f5f3">
    <text x="152" y="80" font-size="34" letter-spacing="1.5">MARTIN J.</text>
    <text x="152" y="120" font-size="34" letter-spacing="1.5">SKALICKY</text>
  </g>

  <!-- vertical divider -->
  <line x1="408" y1="48" x2="408" y2="128" stroke="#56775f" stroke-width="2" stroke-linecap="round"/>

  <!-- right title -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600" fill="#94af9b" letter-spacing="4">
    <text x="432" y="83" font-size="20">DIGITAL</text>
    <text x="432" y="113" font-size="20">ARCHITECT</text>
  </g>
</svg>
